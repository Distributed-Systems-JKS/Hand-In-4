syntax = "proto3";

package grpc;

option go_package = "/protobufs";

service Client {
    rpc RequestAccess (Request) returns (Response) {};
    rpc ReplyToRequest (Response) returns (Empty){};
}

message Request {
    int64 id = 1;
    int64 timestamp = 2;
}

message Response {
    int64 id = 1;
    int64 timestamp = 2;
    bool permission = 3;
}

message Empty {}





