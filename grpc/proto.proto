syntax = "proto3";

package grpc;

option go_package = "/protobufs";

service Greeter {
    rpc sayHello (HelloRequest) returns (HelloResponse) {};
}

message HelloRequest {
    string name = 1;
}

message HelloResponse {
    string message = 1;
}

