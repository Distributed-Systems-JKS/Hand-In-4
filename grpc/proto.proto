syntax = "proto3";

package grpc;

option go_package = "./proto";

service ClientServer {

    // Called whenever a node wants to request access to the critical section
    rpc RequestAccess (Request) returns (Response) {};

    // Called whenever a node replies to a peer's request
    rpc ReplyToRequest (Response) returns (Empty){};
}

message Request {
    int64 id = 1;
    int64 timestamp = 2;
}

message Response {
    int64 id = 1;
    int64 timestamp = 2;
    bool permission = 3;
}

message Empty {}

